# ======================================================================================================
#  OmniLogin - config.properties for Velocity and BungeeCord   (MIT License, by Natan307)
#  Messages support '&' color codes and \n for a new line.
# ======================================================================================================

# Let players without a Microsoft/Ely.by account join, as long as their name is free.
login.allow-cracked=true
# If the name check fails (API down), refuse the cracked player instead of letting them in.
login.deny-when-lookup-fails=true
# Names that may always join as cracked (comma separated).
login.bypass-names=

# --- Velocity only: session relay (needed to verify Ely.by accounts) ------------------------------------
# Start Velocity with:  -Dmojang.sessionserver=http://127.0.0.1:8765/session/minecraft/hasJoined
relay.enabled=true
relay.host=127.0.0.1
relay.port=8765

upstream.microsoft-session=https://sessionserver.mojang.com/session/minecraft
upstream.elyby-session=https://authserver.ely.by/session
upstream.microsoft-profile-api=https://api.mojang.com/users/profiles/minecraft/
upstream.elyby-profile-api=https://authserver.ely.by/api/users/profiles/minecraft/
upstream.timeout-ms=4000
upstream.cache.registered-seconds=1800
upstream.cache.free-seconds=300

messages.reserved-name=&cThis name is registered as an official Microsoft/Ely.by account.\n&7Please use another name!
messages.cracked-disabled=&cCracked (unverified) players are not allowed on this server.\n&7Please log in with a Microsoft or Ely.by account.
messages.lookup-failed=&cCould not verify your name right now.\n&7Please try again in a moment.
messages.elyby-unsupported-proxy=&cThis name belongs to an Ely.by account, which this proxy cannot verify.\n&7Please use another name or a Microsoft account.
